application:
  name: GateKeeper AI

camera:
  width: 1640
  height: 1232
  fps: 1
  rotation: 180
  flip_horizontal: false
  flip_vertical: false
  diagnostics: true
  pipeline: rgb
  controls:
    AwbEnable: true
    AeEnable: true
    Brightness: 0.0
    Contrast: 1.0
    Saturation: 1.0
    Sharpness: 1.0
    ExposureValue: 0.0
    AnalogueGain: 1.0

display:
  enabled: true
  fullscreen: false
  window_name: GateKeeper AI
  show_fps: true
  show_motion: true
  show_plate_box: true
  show_confidence: true
  show_timestamp: true
  save_snapshot_key: s
  show_crosshair: true
  show_grid: true
  show_safe_area: true
  show_bbox: true
  show_status: true
  detection_area:
    x: 164
    y: 123
    width: 1312
    height: 986
  plate_ideal_area:
    x: 574
    y: 493
    width: 492
    height: 246

plate_detector:
  debug: true
  confidence_threshold: 0.70
  aspect_ratio_min: 3.5
  aspect_ratio_max: 6.5
  min_area: 2500
  max_area: 70000
  min_rectangularity: 0.80
  max_rotation: 15
  border_margin: 20

preview:
  pipeline: bgr

debug:
  enabled: true
  live_preview: true
  save_annotated_frames: true

logging:
  level: INFO

motion:
  enabled: true
  threshold: 25
  min_area: 1000
  end_delay_seconds: 2

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  stream_fps: 5

plate_calibration:
  enabled: true
  save_frames: true
  show_candidates: true
  show_rejected: true
  show_metrics: true
