application:
  name: GateKeeper AI

camera:
  width: 1640
  height: 1232
  fps: 1

display:
  enabled: true
  fullscreen: false
  window_name: GateKeeper AI
  show_fps: true
  show_motion: true
  show_plate_box: true
  show_confidence: true
  show_timestamp: true
  save_snapshot_key: s
  show_crosshair: true
  show_grid: true
  show_safe_area: true
