application:
  name: GateKeeper AI

camera:
  width: 1640
  height: 1232
  fps: 1

display:
  enabled: true
  fullscreen: false
  window_name: GateKeeper AI
  show_fps: true
  show_motion: true
  show_plate_box: true
  show_confidence: true
  show_timestamp: true
  save_snapshot_key: s

debug:
  enabled: true
  live_preview: true
  save_annotated_frames: true

logging:
  level: INFO

motion:
  enabled: true
  threshold: 25
  min_area: 1000
  end_delay_seconds: 2

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  stream_fps: 5
