<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GateKeeper AI Camera Diagnostics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="dashboard diagnostics-page">
    <section class="preview-card">
      <p class="eyebrow">Camera Diagnostics</p>
      <h1>Orientation & Camera Diagnostics</h1>
      <div id="diagnostic_images" class="diagnostic-grid"></div>
    </section>
    <aside class="status-card">
      <p class="eyebrow">Orientation</p>
      <label>Rotation
        <select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
      </label>
      <label><input type="checkbox" id="flip_horizontal"> Flip Horizontal</label>
      <label><input type="checkbox" id="flip_vertical"> Flip Vertical</label>
      <p class="eyebrow">Camera Controls</p>
      <label><input type="checkbox" id="AwbEnable"> Auto White Balance</label>
      <label><input type="checkbox" id="AeEnable"> Auto Exposure</label>
      <label>Brightness <input type="number" step="0.1" id="Brightness"></label>
      <label>Contrast <input type="number" step="0.1" id="Contrast"></label>
      <label>Saturation <input type="number" step="0.1" id="Saturation"></label>
      <label>Sharpness <input type="number" step="0.1" id="Sharpness"></label>
      <label>Exposure Compensation <input type="number" step="0.1" id="ExposureValue"></label>
      <label>Gain <input type="number" step="0.1" id="AnalogueGain"></label>
      <button id="save_camera" type="button">Save Camera Configuration</button>
      <p class="eyebrow">Runtime Verification</p>
      <dl>
        <dt>Verification</dt><dd id="verification_status">UNKNOWN</dd>
        <dt>Frame IDs</dt><dd id="verification_ids">n/a</dd>
        <dt>Checksums</dt><dd id="verification_checksums">n/a</dd>
        <dt>Pipeline</dt><dd id="verification_pipeline">n/a</dd>
      </dl>
      <p class="eyebrow">Current Runtime Pipeline</p>
      <pre id="pipeline_status"></pre>
      <pre id="camera_status"></pre>
    </aside>
  </main>
<script>
const names = [['frame_raw.jpg','raw'],['frame_rgb.jpg','rgb'],['frame_bgr.jpg','bgr'],['frame_swap_rb.jpg','swap_rb']];
function controls(){const c={}; for (const id of ['AwbEnable','AeEnable']) c[id]=document.getElementById(id).checked; for (const id of ['Brightness','Contrast','Saturation','Sharpness','ExposureValue','AnalogueGain']) { const v=document.getElementById(id).value; if (v !== '') c[id]=Number(v); } return c;}
async function refreshPipeline(){ const p=await fetch('/api/pipeline').then(r=>r.json()); pipeline_status.textContent=JSON.stringify(p,null,2); verification_status.textContent=p.verification || 'UNKNOWN'; verification_ids.textContent=JSON.stringify({raw:p.raw_frame_id, master:p.master_frame_id, preview:p.preview_frame_id, snapshot:p.snapshot_frame_id, motion:p.motion_frame_id, plate:p.plate_frame_id, diagnostics:p.diagnostics_source_id}); verification_checksums.textContent=JSON.stringify({master:p.checksum, preview:p.preview_checksum, snapshot:p.snapshot_checksum}); verification_pipeline.textContent=JSON.stringify({pipeline:p.pipeline, rotation:p.rotation, flip:p.flip}); return p; }
async function apply(update){ const r=await fetch('/api/camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(update)}); document.getElementById('camera_status').textContent=JSON.stringify(await r.json(), null, 2); await refreshPipeline(); render(); }
function currentPipeline(){ try { return JSON.parse(pipeline_status.textContent || '{}')?.camera_pipeline || JSON.parse(camera_status.textContent || '{}')?.camera?.pipeline || JSON.parse(camera_status.textContent || '{}')?.active_pipeline || 'rgb'; } catch { return 'rgb'; }}
function render(){ const root=document.getElementById('diagnostic_images'); const active=currentPipeline(); root.innerHTML=''; for (const [file,pipeline] of names){ const selected=pipeline===active; const card=document.createElement('article'); card.className='diagnostic-card'; card.innerHTML=`<h2>${file}</h2><p>Pipeline: ${pipeline}</p><img src="/diagnostics/${file}?t=${Date.now()}" alt="${file}"><button type="button" ${selected ? 'disabled' : ''}>${selected ? '✔ Active Pipeline' : 'Use this pipeline'}</button>`; card.querySelector('button').onclick=()=>apply({pipeline}); root.appendChild(card); }}
for (const id of ['rotation','flip_horizontal','flip_vertical']) document.addEventListener('change', e=>{ if(e.target.id===id) apply({rotation:Number(rotation.value), flip_horizontal:flip_horizontal.checked, flip_vertical:flip_vertical.checked}); });
document.getElementById('save_camera').onclick=()=>apply({rotation:Number(rotation.value), flip_horizontal:flip_horizontal.checked, flip_vertical:flip_vertical.checked, controls:controls()});
for (const id of ['AwbEnable','AeEnable','Brightness','Contrast','Saturation','Sharpness','ExposureValue','AnalogueGain']) document.getElementById(id).addEventListener('change', ()=>apply({controls:controls()}));
render(); Promise.all([fetch('/api/diagnostics').then(r=>r.json()), refreshPipeline()]).then(([s,p])=>{rotation.value=p.rotation ?? s.camera_orientation?.rotation ?? 0; flip_horizontal.checked=!!(p.flip_horizontal ?? s.camera_orientation?.flip_horizontal); flip_vertical.checked=!!(p.flip_vertical ?? s.camera_orientation?.flip_vertical); camera_status.textContent=JSON.stringify(s,null,2); render();});
</script>
</body>
</html>
